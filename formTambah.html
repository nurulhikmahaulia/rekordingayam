<!-- Modal untuk Tambah Data -->
<div class="modal fade" id="dataModal" tabindex="-1" aria-labelledby="dataModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dataModalLabel"><i class="fas fa-edit"></i> Tambah Data Rekording</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="dataForm">
                    <input type="hidden" id="recordId">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="minggu" class="form-label">Minggu</label>
                            <input type="number" class="form-control" id="minggu" required min="1" max="52">
                        </div>
                        <div class="col-md-4">
                            <label for="hari" class="form-label">Hari</label>
                            <select class="form-select" id="hari" required>
                                <option value="">Pilih Hari</option>
                                <option value="Minggu">Minggu</option>
                                <option value="Senin">Senin</option>
                                <option value="Selasa">Selasa</option>
                                <option value="Rabu">Rabu</option>
                                <option value="Kamis">Kamus</option>
                                <option value="Jumat">Jumat</option>
                                <option value="Sabtu">Sabtu</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="tanggal" class="form-label">Tanggal</label>
                            <input type="date" class="form-control" id="tanggal" required>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="unggul" class="form-label">Unggul</label>
                            <input type="number" class="form-control" id="unggul" value="1500" min="0">
                        </div>
                        <div class="col-md-4">
                            <label for="mati" class="form-label">Mati</label>
                            <input type="number" class="form-control" id="mati" min="0">
                        </div>
                        <div class="col-md-4">
                            <label for="sisa" class="form-label">Sisa</label>
                            <input type="number" class="form-control" id="sisa" readonly>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="pakanKg" class="form-label">Pakan (Kg)</label>
                            <input type="number" step="0.1" class="form-control" id="pakanKg" min="0">
                            <div class="form-text">Contoh: 150 kg untuk 1500 ekor = Fi 100</div>
                        </div>
                        <div class="col-md-6">
                            <label for="pakanFi" class="form-label">Pakan (Fi) - Otomatis</label>
                            <input type="number" step="0.1" class="form-control calculated-field" id="pakanFi" readonly>
                            <div class="form-text">Satuan: gram/ekor/hari</div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-3">
                            <label for="telurKg" class="form-label">Telur (Kg)</label>
                            <input type="number" step="0.1" class="form-control" id="telurKg" min="0">
                        </div>
                        <div class="col-md-3">
                            <label for="telurButir" class="form-label">Telur (Butir)</label>
                            <input type="number" class="form-control" id="telurButir" min="0">
                            <div class="form-text">Contoh: 348 butir untuk 1500 ekor = %HD 23.2</div>
                        </div>
                        <div class="col-md-3">
                            <label for="persenHD" class="form-label">%HD - Otomatis</label>
                            <input type="number" step="0.1" class="form-control calculated-field" id="persenHD" readonly>
                        </div>
                        <div class="col-md-3">
                            <label for="rusak" class="form-label">Rusak</label>
                            <input type="number" class="form-control" id="rusak" min="0">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="keterangan" class="form-label">Keterangan</label>
                        <input type="text" class="form-control" id="keterangan" placeholder="Vitamin, penyakit, dll.">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> Batal
                </button>
                <button type="button" class="btn btn-primary" id="btnSimpan">
                    <i class="fas fa-save"></i> Simpan
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// Fungsi untuk menghitung nilai otomatis
function hitungOtomatis() {
    // Hitung sisa unggul
    const unggul = parseFloat(document.getElementById('unggul').value) || 0;
    const mati = parseFloat(document.getElementById('mati').value) || 0;
    const sisa = unggul - mati;
    document.getElementById('sisa').value = sisa > 0 ? sisa : 0;
    
    // Hitung pakan Fi
    const pakanKg = parseFloat(document.getElementById('pakanKg').value) || 0;
    const pakanFi = sisa > 0 ? (pakanKg * 1000) / sisa : 0;
    document.getElementById('pakanFi').value = pakanFi.toFixed(1);
    
    // Hitung %HD
    const telurButir = parseFloat(document.getElementById('telurButir').value) || 0;
    const persenHD = sisa > 0 ? (telurButir / sisa) * 100 : 0;
    document.getElementById('persenHD').value = persenHD.toFixed(1);
}

// Tambahkan event listener untuk input yang mempengaruhi perhitungan
document.addEventListener('DOMContentLoaded', function() {
    const inputs = ['unggul', 'mati', 'pakanKg', 'telurButir'];
    inputs.forEach(function(id) {
        const input = document.getElementById(id);
        if (input) {
            input.addEventListener('input', hitungOtomatis);
        }
    });
    
    // Set tanggal default ke hari ini
    const today = new Date().toISOString().split('T')[0];
    const tanggalInput = document.getElementById('tanggal');
    if (tanggalInput) {
        tanggalInput.value = today;
    }
});
</script>
